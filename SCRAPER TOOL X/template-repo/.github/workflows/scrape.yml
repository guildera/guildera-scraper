name: Guildera Scraper

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (user/hashtag/keyword/url/cashtag)'
        required: false
        default: ''
        type: string
      target:
        description: 'Search target'
        required: false
        default: ''
        type: string
      max_results:
        description: 'Max results'
        required: false
        default: ''
        type: string
      media_only:
        description: 'Media only (true/false)'
        required: false
        default: ''
        type: string
      raw_query:
        description: 'Advanced search raw query'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Decode auth cookies
        run: echo "$X_STATE" | base64 -d > state.json
        env:
          X_STATE: ${{ secrets.X_STATE }}
      - name: Run scraper
        run: node scraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type || '' }}
          TARGET: ${{ github.event.inputs.target || '' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || '10' }}
          MEDIA_ONLY: ${{ github.event.inputs.media_only || 'false' }}
          RAW_QUERY: ${{ github.event.inputs.raw_query || '' }}
          KEY_HASH: ${{ secrets.KEY_HASH }}
